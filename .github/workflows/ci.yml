name: Java Azure Function CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write


jobs:

  # ============================================================
  # CI - BUILD
  # ============================================================

  build:

    name: Build and Test

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Java 17
      # ----------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # ----------------------------------------------------------
      # Verify Java
      # ----------------------------------------------------------

      - name: Verify Java version
        run: java -version


      # ----------------------------------------------------------
      # Run unit tests
      # ----------------------------------------------------------

      - name: Run tests
        run: mvn clean test


      # ----------------------------------------------------------
      # Package Azure Function
      # ----------------------------------------------------------

      - name: Package Function
        run: mvn package


      # ----------------------------------------------------------
      # Upload build artifact
      # ----------------------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: target/
          retention-days: 7


  # ============================================================
  # CD - DEVELOPMENT
  # ============================================================

  deploy-dev:

    name: Deploy to Development

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Download artifact generated by BUILD
      # ----------------------------------------------------------

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: target/


      # ----------------------------------------------------------
      # Java 17
      # ----------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # ----------------------------------------------------------
      # Azure OIDC Login
      # ----------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------------------
      # Deploy to DEV
      # ----------------------------------------------------------

      - name: Deploy Azure Function - DEV
        run: mvn azure-functions:deploy


  # ============================================================
  # CD - PRODUCTION
  # ============================================================

  deploy-prod:

    name: Deploy to Production

    needs: deploy-dev

    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Download EXACT SAME artifact
      # ----------------------------------------------------------

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: target/


      # ----------------------------------------------------------
      # Java 17
      # ----------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # ----------------------------------------------------------
      # Azure OIDC Login
      # ----------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------------------
      # Deploy to PROD
      # ----------------------------------------------------------

      - name: Deploy Azure Function - PROD
        run: mvn azure-functions:deploy -DfunctionAppName=yogifunctionapp-prod