name: Java Azure Function CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# Required for GitHub OIDC authentication
permissions:
  contents: read
  id-token: write


jobs:

  # ============================================================
  # 1. BUILD
  # ============================================================

  build:

    name: Build Java Function

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Setup Java 17
      # ----------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # ----------------------------------------------------------
      # Verify Java
      # ----------------------------------------------------------

      - name: Verify Java
        run: java -version


      # ----------------------------------------------------------
      # Run unit tests
      # ----------------------------------------------------------

      - name: Run tests
        run: mvn clean test


      # ----------------------------------------------------------
      # Build Azure Function
      # ----------------------------------------------------------

      - name: Package Azure Function
        run: mvn package


      # ----------------------------------------------------------
      # Display generated Azure Function package
      # Useful for troubleshooting
      # ----------------------------------------------------------

      - name: Show generated Function package
        run: |
          echo "Contents of target/azure-functions:"
          find target/azure-functions -maxdepth 3 -type f | sort


      # ----------------------------------------------------------
      # Create deployment ZIP
      #
      # Maven generates:
      #
      # target/azure-functions/yogifunctionapp/
      #
      # We ZIP the CONTENTS of that directory.
      # ----------------------------------------------------------

      - name: Create Function deployment ZIP
        run: |
          cd target/azure-functions/yogifunctionapp
          zip -r ../../../function.zip .


      # ----------------------------------------------------------
      # Verify ZIP
      # ----------------------------------------------------------

      - name: Verify deployment ZIP
        run: |
          echo "Deployment package:"
          ls -lh function.zip

          echo ""
          echo "ZIP contents:"
          unzip -l function.zip | head -100


      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------

      - name: Upload Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: function.zip
          retention-days: 7



  # ============================================================
  # 2. DEPLOY DEVELOPMENT
  # ============================================================

  deploy-dev:

    name: Deploy to DEV

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      # ----------------------------------------------------------
      # Download EXACT SAME artifact created by BUILD
      # ----------------------------------------------------------

      - name: Download Function artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: .


      # ----------------------------------------------------------
      # Verify artifact
      # ----------------------------------------------------------

      - name: Verify artifact
        run: |
          ls -lh function.zip
          unzip -l function.zip | head -50


      # ----------------------------------------------------------
      # Azure Login using OIDC
      # ----------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------------------
      # Deploy ZIP to DEV Function App
      # ----------------------------------------------------------

      - name: Deploy Function to DEV
        run: |
          az functionapp deployment source config-zip \
            --resource-group MyRG \
            --name yogifunctionapp \
            --src function.zip



  # ============================================================
  # 3. DEPLOY PRODUCTION
  # ============================================================

  deploy-prod:

    name: Deploy to PROD

    needs: deploy-dev

    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:

      # ----------------------------------------------------------
      # Download EXACT SAME artifact
      # ----------------------------------------------------------

      - name: Download Function artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: .


      # ----------------------------------------------------------
      # Verify artifact
      # ----------------------------------------------------------

      - name: Verify artifact
        run: |
          ls -lh function.zip
          unzip -l function.zip | head -50


      # ----------------------------------------------------------
      # Azure Login using PROD OIDC identity
      # ----------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ----------------------------------------------------------
      # Deploy ZIP to PROD Function App
      # ----------------------------------------------------------

      - name: Deploy Function to PROD
        run: |
          az functionapp deployment source config-zip \
            --resource-group MyRG \
            --name yogifunctionapp-prod \
            --src function.zip